name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python files
        run: python -m compileall src scripts tests

      - name: Print environment
        run: python scripts/print_env.py

      - name: Run CPU smoke
        run: python scripts/smoke_cpu.py

      - name: Run TPU smoke
        run: python scripts/smoke_tpu.py

      - name: Export fake teacher targets
        run: python scripts/export_teacher_targets.py --config configs/teacher_export_stub.yaml

      - name: Inspect fake teacher targets
        run: python scripts/inspect_targets.py artifacts/teacher_targets/fake_export

      - name: Run student train smoke
        run: python scripts/train_student_smoke.py --targets artifacts/teacher_targets/fake_export --max-steps 2

      - name: Run RWKV7 reference student train smoke
        run: python scripts/train_student_smoke.py --targets artifacts/teacher_targets/fake_export --student-architecture rwkv7_reference --max-steps 2

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .
