lm:
  data:
    prompt_corpus: corpora/eval_regression_prompts.jsonl
    prompt_split: validation
    prompt_tags: ["eval"]
    prompt_limit: 4
    sequence_length: 32
    batch_size: 2
    tokenizer: smoke
    shuffle: false
    seed: 0
  student:
    architecture: rwkv7_reference
    vocab_size: 512
    hidden_size: 128
    num_layers: 2
    emit_logits: true
    tie_embeddings: false
  optimizer:
    type: adamw
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 0.00000001
    weight_decay: 0.01
  lr_schedule:
    type: warmup_cosine
    warmup_steps: 1
    total_steps: 4
    min_learning_rate: 0.0001
  gradients:
    max_grad_norm: 1.0
    clip_epsilon: 0.000001
  distributed:
    enabled: true
    mode: pmap_data_parallel
    axis_name: data
    require_multiple_devices: false
    min_device_count: 2
  training:
    stage: 3
    max_steps: 2
    seed: 0
  checkpoint:
    checkpoint_out: null
    resume_from: null
    overwrite: false
  tracking:
    enabled: false
    run_root: runs
    run_name: null
    overwrite: false
    tags: []
    notes: []
