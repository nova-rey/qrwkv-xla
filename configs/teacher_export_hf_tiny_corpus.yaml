teacher:
  family: hf-causal-lm
  policy_label: tiny-hf-smoke-corpus
  fallback_label: null
  resolved_model_id: sshleifer/tiny-gpt2
  tokenizer_id: sshleifer/tiny-gpt2
  trust_remote_code: false
  revision: null
  device: cpu
  dtype: auto

targets:
  sequence_length: 32
  hidden_size: null
  num_layers: null
  dtype: fp32
  include_logits: true
  include_attention_targets: false
  vocab_size: 50257
  prompt_texts: []
  prompt_corpus: ../corpora/smoke_prompts.jsonl
  prompt_split: train
  prompt_tags:
    - smoke
  prompt_limit: 4

runtime:
  exporter_backend: hf
  batch_size: 2
  num_shards: 1
  seed: 1234
  output_dir: ../artifacts/teacher_targets/hf_tiny_corpus
