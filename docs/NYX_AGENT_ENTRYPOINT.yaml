project: QRWKV-XLA
start_here:
  - docs/QRWKV_SNAPSHOT.yaml
  - docs/ARCHITECTURE.md
  - docs/ROADMAP.md
  - docs/DEV_WORKFLOW.md
  - docs/PHASE_CHECKLIST.md

current_phase:
  phase: 46
  checkpoint: pjit_sharding_compile_smoke
  title: Add tiny pjit / sharding compile smoke

workflow:
  primary_agent: Nyx
  sub_agent: Codex
  spec_style: whole_implementation_spec
  legacy_prompt_structure: A/B/C optional only if useful

instructions:
  - Keep changes small and reversible.
  - Maintain Ruff + Black-compatible formatting compliance.
  - Keep tests passing.
  - Update QRWKV_SNAPSHOT.yaml after meaningful changes.
  - Append to QRWKV_BIBLE.md; never overwrite historical entries.
  - Do not implement serious model logic during this foundation phase.
  - Do not introduce CUDA, Triton, flash-attention, or DeepSpeed dependencies.
  - Do not make notebooks the primary workflow.
  - Keep P36, P37, P38, and P39 TPU smokes manual and opt-in; normal CI remains CPU-only.
  - Keep P40 RADLADS source fixture import manual/offline-safe; do not invent RADLADS outputs.
  - Keep P41 HF/safetensors export as tiny local parity only; do not claim a production HF model class.
  - Keep P42 official lm_eval execution deferred; default eval smoke is local token-id toy scoring only.
  - Keep P43 WKV7 fixture work limited to the slow recurrence/state core; Pallas remains an unsupported placeholder.
  - Keep P44 streaming data work local/offline and bounded; it is not a real training phase or quality claim.
  - Keep P45 multi-scale dry-runs metadata-first; do not claim real training, pjit/sharding, full-scale measured memory, or one-device 7B training.
  - Keep P46 as a tiny compile smoke only; report single-device fallback honestly and do not claim large-model sharding, throughput, or production sharded checkpointing.
