  helper_module: src/qrwkv_xla/parity/radlads_head_to_head.py
  artifact_dir: artifacts/p53_radlads_qrwkv_head_to_head
  source_payload: P52 deterministic_finite seed 5353
  reports:
    - manifest.json
    - head_to_head_comparison_report.json
    - P53_HEAD_TO_HEAD_REPORT.md
  caveats:
    - live_radlads_blockers_are_reported_as_unsupported
    - no_pallas_no_tpu_optimization_no_training_no_qwen_scale_no_hf_model_class

