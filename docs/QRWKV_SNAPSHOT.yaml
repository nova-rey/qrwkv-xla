project: QRWKV-XLA
phase: 57
checkpoint: radlads_log_w_decay_parity
run_tracking: local_opt_in_json_jsonl
status: complete
mission: >
  Build a JAX/XLA-first RADLADS-style transformer-to-RWKV7 recurrent
  conversion pipeline for TPU-first training.

reference_repo:
  name: nova-rey/radlads-TPU-adapter
  role: reference_only
  direct_port: false

teacher:
  family: qwen
  primary_policy: latest_qwen3_open_weight_available_at_experiment_time
  fallback_label: Qwen3.0

teacher_export_paths:
  config_relative:
    - targets.prompt_file
    - targets.prompt_corpus
    - targets.tokenized_corpus
    - runtime.output_dir
    - runtime.qwen_policy_path
  cli_overrides_relative_to: cwd

student:
  architecture: RWKV7-style recurrent student
  framework: JAX
  backends:
    rwkv7_reference: placeholder_smoke_backend
    rwkv7_radlads_reference: RADLADS-shaped JAX reference backend, not full RADLADS parity.
    rwkv7_qwen_reference: Qwen/RADLADS-compatible slow JAX reference path with explicit P50 replay mode, not optimized kernel parity.
  target_runtime:
    - CPU debug
    - TPU smoke
    - TPU scale-up later

hardware:
  local: VM with no GPU
  free_online:
    - Kaggle TPU if available
    - Colab TPU if available
    - Modal/Lightning GPU optional sanity only

workflow:
  primary_agent: Nyx
  sub_agent: Codex
  spec_style: whole_implementation_spec
  legacy_prompt_structure: A/B/C optional only if useful
  lint_format: Ruff + Black-compatible
  local_validation: Strategy A editable install, then scripts/validate_pipeline.py or scripts/validate_local.py
  bible_policy: append_only

current_goal: >
  Audit the P56 first divergent WKV trace stage by comparing RADLADS log_w rows
  from source trace JSONL against QRWKV log_w captured from the current
  diagnostics path, without patching model math or loosening tolerances.

checkpointing:
  format: JSON manifest plus NPZ arrays
  directory: checkpoints/
  gitignored: true
  orbax_required: false
  optimizer_state: true

hf_safetensors_export:
  phase: P41
  module: qrwkv_xla.export
  export_script: scripts/export_student_hf_safetensors.py
  smoke_script: scripts/run_export_smoke.py
  smoke_artifact_dir: artifacts/p41_hf_safetensors_export_smoke
  files:
    - config.json
    - model.safetensors
    - qrwkv_xla_export.json
    - weight_map.json
    - export_smoke_report.json
    - P41_EXPORT_SMOKE_REPORT.md
  proves:
    - tiny_checkpoint_export_reload_output_parity
  does_not_prove:
    - production_hf_model_class
    - qwen_scale_export
    - sharded_or_pjit_export
    - lm_eval
    - model_quality

lm_eval_smoke:
  phase: P42
  mode: lm_eval_style_toy_harness
  module: qrwkv_xla.eval.exported_student
  smoke_script: scripts/run_lm_eval_smoke.py
  p41_export_dir: artifacts/p41_hf_safetensors_export_smoke
  toy_task: tests/fixtures/eval/p42_toy_continuations.jsonl
  smoke_artifact_dir: artifacts/eval/p42_lm_eval_smoke
  files:
    - results.json
    - P42_RESULTS.md
    - p42_results_bundle.tar.gz
  optional_extra: eval
  official_lm_eval: deferred
  proves:
    - p41_export_loads_for_tiny_eval
    - deterministic_continuation_loglikelihood_scoring
    - finite_toy_metrics
  does_not_prove:
    - official_lm_eval_task_suite
    - production_hf_model_class
    - qwen_scale_evaluation
    - model_quality

wkv7_correctness_fixtures:
  phase: P43
  schema: qrwkv_xla.wkv7_correctness.v1
  module: qrwkv_xla.kernels
  fixture_script: scripts/generate_wkv7_correctness_fixtures.py
  compare_script: scripts/compare_wkv7_correctness_fixtures.py
  artifact_dir: artifacts/kernels/p43_wkv7_correctness
  candidates:
    reference: current slow JAX WKV7 recurrence/state core
    pallas: unsupported placeholder
  files:
    - manifest.json
    - P43_WKV7_FIXTURE_SUMMARY.md
    - comparison_report.json
    - P43_WKV7_COMPARISON_REPORT.md
    - cases/*/inputs.npz
    - cases/*/expected.npz
  proves:
    - deterministic_tiny_reference_core_fixtures
    - full_scan_stepwise_equivalence
    - reference_candidate_fixture_comparison
  does_not_prove:
    - optimized_pallas_kernel_correctness
    - tpu_performance
    - full_radlads_or_qwen_block_parity
    - qwen_scale_execution

streaming_data_pipeline:
  phase: P44
  mode: local_offline_streaming_data_dry_run
  module: qrwkv_xla.data
  build_script: scripts/build_streaming_data_dry_run.py
  data_script: scripts/run_streaming_data_dry_run.py
  trainer_script: scripts/run_streaming_trainer_dry_run.py
  artifact_dir: artifacts/data/p44_streaming_dry_run
  manifest: artifacts/data/p44_streaming_dry_run/manifest.json
  batch_keys:
    - input_ids
    - labels
    - attention_mask
    - label_mask
  files:
    - manifest.json
    - P44_DATASET_SUMMARY.md
    - streaming_dry_run_report.json
    - P44_STREAMING_DRY_RUN_REPORT.md
    - resume_cursor.json
    - trainer_dry_run_report.json
    - P44_TRAINER_DRY_RUN_REPORT.md
    - shards/*.npz
  proves:
    - manifest_backed_sharded_token_data
    - chunked_streaming_iteration
    - deterministic_order
    - optional_seeded_shuffle
    - resume_cursor_exact_integer_replay
    - attention_and_loss_mask_validation
    - padding_and_token_waste_accounting
    - finite_cpu_local_token_accounting
    - existing_trainer_batch_contract_ingestion
  does_not_prove:
    - full_scale_throughput
    - real_training_quality
    - cloud_or_distributed_ingest
    - pjit_or_sharding
    - pallas
    - wandb
    - qwen_scale_target_generation

pjit_sharding_smoke:
  phase: P46
  mode: tiny_pjit_sharding_compile_smoke
  module: qrwkv_xla.sharding
  smoke_script: scripts/run_pjit_sharding_smoke.py
  artifact_dir: artifacts/p46_pjit_sharding_smoke
  policy: data_parallel_single_axis
  files:
    - pjit_sharding_smoke_report.json
    - P46_RESULTS.md
  records:
    - backend
    - platform
    - device_count
    - local_device_count
    - device_kinds
    - mesh_shape
    - mesh_axis_names
    - multi_device
    - fallback_reason
    - compile_api
  proves:
    - named_mesh_creation
    - explicit_data_parallel_batch_sharding_annotation
    - tiny_compile_forward_loss_path
    - tiny_update_smoke
    - finite_loss
    - honest_single_device_fallback_reporting
  does_not_prove:
    - large_model_sharding
    - throughput
    - production_sharded_checkpointing
    - multi_host_training
    - full_distributed_optimizer_state_strategy
    - pallas_wkv7_kernels
    - qwen_scale_training

experiment_tracking_smoke:
  phase: P47
  mode: local_source_of_truth_with_optional_wandb_adapter
  module: qrwkv_xla.tracking
  smoke_script: scripts/run_tracking_smoke.py
  artifact_dir: artifacts/p47_experiment_tracking_smoke
  default_tracking: local
  optional_tracking:
    - wandb-offline
    - wandb-online
  files:
    - P47_RESULTS.md
    - tracking_smoke_report.json
    - local_run/run_metadata.json
    - local_run/config.json
    - local_run/metrics.jsonl
    - local_run/summary.json
    - local_run/artifacts_manifest.json
    - local_run/files/*
  records:
    - phase
    - created_at_utc
    - repo_commit
    - git_dirty
    - python_version
    - jax_metadata
    - backend
    - default_backend
    - device_count
    - local_device_count
    - device_kinds
    - device_platforms
    - hostname
    - command
    - script_name
    - tracking_mode
    - artifact_root
  required_metrics:
    - train/loss
    - train/loss_is_finite
    - train/tokens_seen
    - train/examples_seen
    - step
  proves:
    - local_tracking_run_layout
    - exact_config_capture
    - finite_tiny_train_step_metrics
    - artifact_manifest_with_size_and_sha256
    - wandb_import_safety_until_requested
  does_not_prove:
    - real_qwen_training
    - long_running_training
    - multi_host_tracking
    - required_wandb_credentials_or_network
    - production_dashboarding
    - sweeps_or_mlop_framework
    - official_benchmark_reporting

optimizers:
  supported:
    - sgd
    - adam
    - adamw
  default: sgd
  adamw_weight_decay: decoupled_all_param_leaves

lr_schedules:
  supported:
    - constant
    - warmup_cosine
  default: constant
  resume_step_source: checkpoint_global_step

gradient_clipping:
  type: global_norm
  default_enabled: false
  disabled_value: null
  clip_epsilon_default: 0.000001
  optimizer_moments_see: clipped_gradients

stage3_ce:
  mode: student_only
  tokenizer: registry_default_smoke_optional_hf_qwen
  prompt_source: prompt_corpus_jsonl
  teacher_targets_required: false
  loss: masked_next_token_cross_entropy
  requires_emit_logits: true

tokenizers:
  default_backend: smoke
  aliases:
    qwen: hf
  optional_backends:
    - hf
  optional_extra: teacher-hf
  lm_config_forms:
    - string
    - mapping
  metadata_used_for:
    - eos_token_id
    - pad_token_id
    - vocab_size

tracking:
  format: run.json plus metrics.jsonl plus summary.json
  directory: runs/
  gitignored: true
  enabled_by_default: false

prompt_corpora:
  format: jsonl_plus_manifest
  directory: corpora/
  hash: ordered_sha256
  target_manifest_linkage: prompt_source

logits_distillation:
  student_emit_logits: optional
  default_tie_embeddings: false
  fake_logits_validation: true
  tiny_hf_radlads_reference_logits_config: configs/distill_stage0_radlads_reference_tiny_hf_logits.yaml
  tiny_hf_live_integration: opt_in_qrwkv_run_hf_integration
  hidden_to_logits_resume: supported_with_fresh_lm_head

radlads_gap_audit:
  phase: P31
  audit_doc: docs/RADLADS_RWKV7_GAP_AUDIT.md
  current_backend_claim: RADLADS-shaped JAX reference backend, not full RADLADS parity.
  current_state_shape: "[layers,batch,heads,head_size,head_size]"
  proves:
    - head-wise_matrix_state_shape
    - scan_based_recurrence_smoke
    - hidden_loss_plumbing
    - logits_loss_plumbing
    - checkpoint_resume_smoke
  does_not_prove:
    - full_radlads_parity
    - qwen_block_parity
    - rope_parity
    - grouped_kv_parity
    - shift_state_cache_parity
    - parameter_mapping_compatibility
    - kernel_readiness
    - model_quality
  recommended_p32_scope: math_completion_and_qwen_block_compatibility_before_kernel_work

qwen_reference_backend:
  phase: P32
  backend: rwkv7_qwen_reference
  claim: Qwen/RADLADS-compatible slow JAX reference path, not optimized kernel parity.
  tiny_hf_distill_config: configs/distill_stage0_qwen_reference_tiny_hf.yaml
  state_object:
    - wkv_matrix_state
    - shift_state
    - next_position
  implements:
    - qwen_decoder_shell_rmsnorm_attention_residual_rmsnorm_mlp_residual
    - slow_rope
    - grouped_kv_equal_and_repeated_heads
    - explicit_num_heads_num_kv_heads_head_size_validation
    - full_sequence_vs_stepwise_output_and_state_equivalence
    - nested_qwen_radlads_oriented_parameter_surface
    - cpu_safe_jit_gradient_optimizer_and_distill_smokes
  does_not_prove:
    - optimized_kernel_parity
    - full_radlads_numerical_parity
    - radlads_checkpoint_compatibility
    - model_quality
    - tpu_or_pallas_readiness

qwen_reference_fixtures:
  phase: P33
  script: scripts/generate_qwen_reference_fixtures.py
  checked_in_dir: tests/fixtures/qwen_reference
  smoke_artifact_dir: artifacts/p33_qwen_reference_fixtures
  seed: 1234
  dtype: float32
  config:
    vocab_size: 32
    hidden_size: 8
    num_layers: 2
    num_heads: 2
    num_kv_heads: 1
    sequence_length: 5
    batch_size: 2
  records:
    - full_sequence_hidden_outputs
    - full_sequence_logits
    - full_sequence_mixer_outputs
    - full_sequence_final_wkv_matrix_state
    - full_sequence_final_shift_state
    - full_sequence_next_position
    - stepwise_hidden_outputs
    - stepwise_logits
    - stepwise_mixer_outputs
    - stepwise_final_wkv_matrix_state
    - stepwise_final_shift_state
    - stepwise_next_position
    - payload_hashes
    - equivalence_summary
    - parameter_surface_hash
  mask_cases:
    - no_mask
    - interior_mask
    - prefix_left_padding
  masked_token_behavior: documented_current_behavior_no_semantics_change
  claim: local slow-reference fixture/caliper coverage only
  does_not_prove:
    - full_radlads_numerical_parity

radlads_source_parity_bridge:
  phase: P40
  schema: radlads_source_parity.v1
  checked_in_dir: tests/fixtures/radlads_source_parity
