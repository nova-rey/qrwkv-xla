project: QRWKV-XLA
phase: 39
checkpoint: planner_generated_tiny_hf_tpu_smoke
run_tracking: local_opt_in_json_jsonl
status: complete
mission: >
  Build a JAX/XLA-first RADLADS-style transformer-to-RWKV7 recurrent
  conversion pipeline for TPU-first training.

reference_repo:
  name: nova-rey/radlads-TPU-adapter
  role: reference_only
  direct_port: false

teacher:
  family: qwen
  primary_policy: latest_qwen3_open_weight_available_at_experiment_time
  fallback_label: Qwen3.0

teacher_export_paths:
  config_relative:
    - targets.prompt_file
    - targets.prompt_corpus
    - targets.tokenized_corpus
    - runtime.output_dir
    - runtime.qwen_policy_path
  cli_overrides_relative_to: cwd

student:
  architecture: RWKV7-style recurrent student
  framework: JAX
  backends:
    rwkv7_reference: placeholder_smoke_backend
    rwkv7_radlads_reference: RADLADS-shaped JAX reference backend, not full RADLADS parity.
    rwkv7_qwen_reference: Qwen/RADLADS-compatible slow JAX reference path, not optimized kernel parity.
  target_runtime:
    - CPU debug
    - TPU smoke
    - TPU scale-up later

hardware:
  local: VM with no GPU
  free_online:
    - Kaggle TPU if available
    - Colab TPU if available
    - Modal/Lightning GPU optional sanity only

workflow:
  primary_agent: Nyx
  sub_agent: Codex
  spec_style: whole_implementation_spec
  legacy_prompt_structure: A/B/C optional only if useful
  lint_format: Ruff + Black-compatible
  local_validation: Strategy A editable install, then scripts/validate_pipeline.py or scripts/validate_local.py
  bible_policy: append_only

current_goal: >
  Add a manual TPU smoke harness that generates a tiny RoPE-valid scale plan,
  writes planner-derived distill/export configs, exports real sshleifer/tiny-gpt2
  HF teacher targets, and runs a tiny rwkv7_qwen_reference hidden+logits
  distill train/resume proof without making TPU execution or live HF download
  part of normal CPU CI.

checkpointing:
  format: JSON manifest plus NPZ arrays
  directory: checkpoints/
  gitignored: true
  orbax_required: false
  optimizer_state: true

optimizers:
  supported:
    - sgd
    - adam
    - adamw
  default: sgd
  adamw_weight_decay: decoupled_all_param_leaves

lr_schedules:
  supported:
    - constant
    - warmup_cosine
  default: constant
  resume_step_source: checkpoint_global_step

gradient_clipping:
  type: global_norm
  default_enabled: false
  disabled_value: null
  clip_epsilon_default: 0.000001
  optimizer_moments_see: clipped_gradients

stage3_ce:
  mode: student_only
  tokenizer: registry_default_smoke_optional_hf_qwen
  prompt_source: prompt_corpus_jsonl
  teacher_targets_required: false
  loss: masked_next_token_cross_entropy
  requires_emit_logits: true

tokenizers:
  default_backend: smoke
  aliases:
    qwen: hf
  optional_backends:
    - hf
  optional_extra: teacher-hf
  lm_config_forms:
    - string
    - mapping
  metadata_used_for:
    - eos_token_id
    - pad_token_id
    - vocab_size

tracking:
  format: run.json plus metrics.jsonl plus summary.json
  directory: runs/
  gitignored: true
  enabled_by_default: false

prompt_corpora:
  format: jsonl_plus_manifest
  directory: corpora/
  hash: ordered_sha256
  target_manifest_linkage: prompt_source

logits_distillation:
  student_emit_logits: optional
  default_tie_embeddings: false
  fake_logits_validation: true
  tiny_hf_radlads_reference_logits_config: configs/distill_stage0_radlads_reference_tiny_hf_logits.yaml
  tiny_hf_live_integration: opt_in_qrwkv_run_hf_integration
  hidden_to_logits_resume: supported_with_fresh_lm_head

radlads_gap_audit:
  phase: P31
  audit_doc: docs/RADLADS_RWKV7_GAP_AUDIT.md
  current_backend_claim: RADLADS-shaped JAX reference backend, not full RADLADS parity.
  current_state_shape: "[layers,batch,heads,head_size,head_size]"
  proves:
    - head-wise_matrix_state_shape
    - scan_based_recurrence_smoke
    - hidden_loss_plumbing
    - logits_loss_plumbing
    - checkpoint_resume_smoke
  does_not_prove:
    - full_radlads_parity
    - qwen_block_parity
    - rope_parity
    - grouped_kv_parity
    - shift_state_cache_parity
    - parameter_mapping_compatibility
    - kernel_readiness
    - model_quality
  recommended_p32_scope: math_completion_and_qwen_block_compatibility_before_kernel_work

qwen_reference_backend:
  phase: P32
  backend: rwkv7_qwen_reference
  claim: Qwen/RADLADS-compatible slow JAX reference path, not optimized kernel parity.
  tiny_hf_distill_config: configs/distill_stage0_qwen_reference_tiny_hf.yaml
  state_object:
    - wkv_matrix_state
    - shift_state
    - next_position
  implements:
    - qwen_decoder_shell_rmsnorm_attention_residual_rmsnorm_mlp_residual
    - slow_rope
    - grouped_kv_equal_and_repeated_heads
    - explicit_num_heads_num_kv_heads_head_size_validation
    - full_sequence_vs_stepwise_output_and_state_equivalence
    - nested_qwen_radlads_oriented_parameter_surface
    - cpu_safe_jit_gradient_optimizer_and_distill_smokes
  does_not_prove:
    - optimized_kernel_parity
    - full_radlads_numerical_parity
    - radlads_checkpoint_compatibility
    - model_quality
    - tpu_or_pallas_readiness

qwen_reference_fixtures:
  phase: P33
  script: scripts/generate_qwen_reference_fixtures.py
  checked_in_dir: tests/fixtures/qwen_reference
  smoke_artifact_dir: artifacts/p33_qwen_reference_fixtures
  seed: 1234
  dtype: float32
  config:
    vocab_size: 32
    hidden_size: 8
    num_layers: 2
    num_heads: 2
    num_kv_heads: 1
    sequence_length: 5
    batch_size: 2
  records:
    - full_sequence_hidden_outputs
    - full_sequence_logits
    - full_sequence_mixer_outputs
    - full_sequence_final_wkv_matrix_state
    - full_sequence_final_shift_state
    - full_sequence_next_position
    - stepwise_hidden_outputs
    - stepwise_logits
    - stepwise_mixer_outputs
    - stepwise_final_wkv_matrix_state
    - stepwise_final_shift_state
    - stepwise_next_position
    - payload_hashes
    - equivalence_summary
    - parameter_surface_hash
  mask_cases:
    - no_mask
    - interior_mask
    - prefix_left_padding
  masked_token_behavior: documented_current_behavior_no_semantics_change
  claim: local slow-reference fixture/caliper coverage only
  does_not_prove:
    - full_radlads_numerical_parity
    - radlads_checkpoint_compatibility
    - radlads_pytorch_triton_cuda_parity
    - optimized_kernel_parity
    - tpu_or_pallas_readiness

scale_planner:
  phase: P34
  package: src/qrwkv_xla/scale_planner
  cli: scripts/plan_model_scale.py
  docs: docs/SCALE_PLANNER.md
  example_dir: docs/examples/scale_plans
  status: planning_only_not_hardware_validated
  model_profiles:
    - tiny_debug
    - p39_tiny_hf_qwen_rope_smoke
    - small_cpu
    - colab_tpu_smoke
    - qwen_0_5b_candidate
    - qwen_1_5b_candidate
    - qwen_7b_stretch
  hardware_profiles:
    - local_cpu_16gb
    - local_cpu_32gb
    - local_cpu_64gb
    - colab_tpu_v2_8
    - colab_tpu_v3_8
    - kaggle_tpu_v5e_8
    - single_l4_24gb
    - single_a100_40gb
    - grant_tpu_v5e_8
    - big_budget_tpu_placeholder
  training_modes:
    - smoke_hidden_sgd
    - smoke_hidden_logits_sgd
    - local_hidden_adamw
    - tpu_hidden_bf16_adamw
    - tpu_hidden_logits_bf16_adamw
    - scale_hidden_only_bf16_adamw
    - scale_sampled_logits_bf16_adamw_placeholder
  estimates:
    - qwen_reference_parameter_count
    - weights
    - gradients
    - optimizer_state
    - optimizer_moments
    - fp32_master_weights
    - activations_estimate
    - wkv_recurrent_state
    - shift_state
    - teacher_hidden_targets_per_batch
    - teacher_logits_targets_per_batch
    - input_ids_and_masks
    - checkpoint_size_estimate
    - xla_overhead_reserve
  fit_classifier: yes_le_60_percent_maybe_le_85_percent_no_above_85_percent
  auto_mode:
    - batch_reductions_only
    - sequence_reductions_only
    - optional_grad_accum_increase
  optional_emit_distill_config: true
  does_not_prove:
    - hardware_validated_fit
    - xla_peak_memory_accuracy
    - pjit_or_model_sharding_support
    - qwen_scale_training_readiness
    - full_radlads_parity
    - impossible_hardware_fit_cancellation

parameter_compatibility_bridge:
  phase: P35
  status: not_implemented_in_this_repo_state
  note: RADLADS checkpoint import/export compatibility remains future work and
    is not proven by P36.

colab_tpu_smoke:
  phase: P36
  status: manual_opt_in
  config: configs/distill_stage0_qwen_reference_colab_tpu_smoke.yaml
  harness: scripts/run_colab_tpu_smoke.py
  docs: docs/COLAB_TPU_SMOKE.md
  target_backend: tpu
  student_architecture: rwkv7_qwen_reference
  loss: hidden_mse_only
  fake_targets: artifacts/teacher_targets/p36_colab_tpu_smoke
  first_checkpoint: checkpoints/p36_tpu_qwen_reference_first
  resume_checkpoint: checkpoints/p36_tpu_qwen_reference_resume
  first_run_dir: runs/p36/p36_tpu_qwen_reference_first
  resume_run_dir: runs/p36/p36_tpu_qwen_reference_resume
  result_markdown: artifacts/p36_colab_tpu_smoke/P36_RESULTS.md
  result_bundle: artifacts/p36_colab_tpu_smoke/p36_results_bundle.tar.gz
  proves:
    - jax_tpu_backend_selected
    - tiny_jax_matmul_sanity
    - fake_hidden_target_export
    - one_step_hidden_distill
    - checkpoint_resume_one_more_step
    - finite_final_loss_and_hidden_mse
    - checkpoint_step_progression_1_to_2
  does_not_prove:
    - qwen_scale_training
    - model_quality
    - logits_kl_on_tpu
    - real_hf_teacher_export_on_tpu
    - pjit_or_sharding
    - multi_host_tpu
    - pallas_or_optimized_wkv7_kernels
    - radlads_checkpoint_compatibility

