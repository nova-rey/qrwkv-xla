project: QRWKV-XLA
phase: 31
checkpoint: radlads_rwkv7_gap_audit
run_tracking: local_opt_in_json_jsonl
status: complete
mission: >
  Build a JAX/XLA-first RADLADS-style transformer-to-RWKV7 recurrent
  conversion pipeline for TPU-first training.

reference_repo:
  name: nova-rey/radlads-TPU-adapter
  role: reference_only
  direct_port: false

teacher:
  family: qwen
  primary_policy: latest_qwen3_open_weight_available_at_experiment_time
  fallback_label: Qwen3.0

teacher_export_paths:
  config_relative:
    - targets.prompt_file
    - targets.prompt_corpus
    - targets.tokenized_corpus
    - runtime.output_dir
    - runtime.qwen_policy_path
  cli_overrides_relative_to: cwd

student:
  architecture: RWKV7-style recurrent student
  framework: JAX
  backends:
    rwkv7_reference: placeholder_smoke_backend
    rwkv7_radlads_reference: RADLADS-shaped JAX reference backend, not full RADLADS parity.
  target_runtime:
    - CPU debug
    - TPU smoke
    - TPU scale-up later

hardware:
  local: VM with no GPU
  free_online:
    - Kaggle TPU if available
    - Colab TPU if available
    - Modal/Lightning GPU optional sanity only

workflow:
  primary_agent: Nyx
  sub_agent: Codex
  spec_style: whole_implementation_spec
  legacy_prompt_structure: A/B/C optional only if useful
  lint_format: Ruff + Black-compatible
  local_validation: Strategy A editable install, then scripts/validate_pipeline.py or scripts/validate_local.py
  bible_policy: append_only

current_goal: >
  Audit the gap between QRWKV-XLA's current rwkv7_radlads_reference backend and
  the local RADLADS RWKV7Qwen2 reference, preserve honest state documentation,
  and recommend a concrete P32 scope without starting kernel, export, sharding,
  pjit, or quality feature work.

checkpointing:
  format: JSON manifest plus NPZ arrays
  directory: checkpoints/
  gitignored: true
  orbax_required: false
  optimizer_state: true

optimizers:
  supported:
    - sgd
    - adam
    - adamw
  default: sgd
  adamw_weight_decay: decoupled_all_param_leaves

lr_schedules:
  supported:
    - constant
    - warmup_cosine
  default: constant
  resume_step_source: checkpoint_global_step

gradient_clipping:
  type: global_norm
  default_enabled: false
  disabled_value: null
  clip_epsilon_default: 0.000001
  optimizer_moments_see: clipped_gradients

stage3_ce:
  mode: student_only
  tokenizer: registry_default_smoke_optional_hf_qwen
  prompt_source: prompt_corpus_jsonl
  teacher_targets_required: false
  loss: masked_next_token_cross_entropy
  requires_emit_logits: true

tokenizers:
  default_backend: smoke
  aliases:
    qwen: hf
  optional_backends:
    - hf
  optional_extra: teacher-hf
  lm_config_forms:
    - string
    - mapping
  metadata_used_for:
    - eos_token_id
    - pad_token_id
    - vocab_size

tracking:
  format: run.json plus metrics.jsonl plus summary.json
  directory: runs/
  gitignored: true
  enabled_by_default: false

prompt_corpora:
  format: jsonl_plus_manifest
  directory: corpora/
  hash: ordered_sha256
  target_manifest_linkage: prompt_source

logits_distillation:
  student_emit_logits: optional
  default_tie_embeddings: false
  fake_logits_validation: true
  tiny_hf_radlads_reference_logits_config: configs/distill_stage0_radlads_reference_tiny_hf_logits.yaml
  tiny_hf_live_integration: opt_in_qrwkv_run_hf_integration
  hidden_to_logits_resume: supported_with_fresh_lm_head

radlads_gap_audit:
  phase: P31
  audit_doc: docs/RADLADS_RWKV7_GAP_AUDIT.md
  current_backend_claim: RADLADS-shaped JAX reference backend, not full RADLADS parity.
  current_state_shape: "[layers,batch,heads,head_size,head_size]"
  proves:
    - head-wise_matrix_state_shape
    - scan_based_recurrence_smoke
    - hidden_loss_plumbing
    - logits_loss_plumbing
    - checkpoint_resume_smoke
  does_not_prove:
    - full_radlads_parity
    - qwen_block_parity
    - rope_parity
    - grouped_kv_parity
    - shift_state_cache_parity
    - parameter_mapping_compatibility
    - kernel_readiness
    - model_quality
  recommended_p32_scope: math_completion_and_qwen_block_compatibility_before_kernel_work

generation_smoke:
  tokenizer: dependency_free_utf8_byte_plus_one
  decoding: greedy_only_full_sequence_recompute
  artifact_dir: eval_outputs/
  gitignored: true
  quality_claims: false

evaluation_harness:
  prompt_corpus: corpora/eval_regression_prompts.jsonl
  config: configs/eval_regression_smoke.yaml
  artifacts:
    - eval.json
    - generations.jsonl
    - sanity.json
    - comparison.json
  strict_default: false
  quality_claims: false
