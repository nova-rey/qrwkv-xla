project: QRWKV-XLA
phase: 4
checkpoint: rwkv7_reference_core
status: reference_core
mission: >
  Build a JAX/XLA-first RADLADS-style transformer-to-RWKV7 recurrent
  conversion pipeline for TPU-first training.

reference_repo:
  name: nova-rey/radlads-TPU-adapter
  role: reference_only
  direct_port: false

teacher:
  family: qwen
  primary_policy: latest_qwen3_open_weight_available_at_experiment_time
  fallback_label: Qwen3.0

student:
  architecture: RWKV7-style recurrent student
  framework: JAX
  target_runtime:
    - CPU debug
    - TPU smoke
    - TPU scale-up later

hardware:
  local: VM with no GPU
  free_online:
    - Kaggle TPU if available
    - Colab TPU if available
    - Modal/Lightning GPU optional sanity only

workflow:
  primary_agent: Nyx
  sub_agent: Codex
  spec_style: whole_implementation_spec
  legacy_prompt_structure: A/B/C optional only if useful
  lint_format: Ruff + Black-compatible
  local_validation: Strategy A editable install, then scripts/validate_local.py
  bible_policy: append_only

current_goal: >
  Establish an XLA-friendly RWKV7-style recurrent reference implementation for
  the JAX student path, with CPU forward, JIT, masking, gradient, and smoke
  training coverage. This reference core is not the final optimized RWKV7
  kernel.
