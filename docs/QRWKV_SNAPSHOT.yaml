    - tiny_attention_mask
    - tiny_prefix_padding_or_left_padding
  checked_in_payload_claim: unsupported_qrwkv_current_behavior_only_not_radlads_outputs
  reports:
    - parity_report.json
    - P40_PARITY_REPORT.md
    - parameter_surface_map.json
    - P40_PARAMETER_SURFACE_MAP.md
  source_checkout:
    path: /home/nyx/.openclaw/workspace/_refs/RADLADS
    branch: radlads
    head: 1b362eb
  unsupported_parameter_surfaces:
    - low_rank_decay_w0_w1_w2
    - low_rank_iclr_a0_a1_a2
    - value_residual_mix_v0_v1_v2
