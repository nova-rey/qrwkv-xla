[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrwkv-xla"
version = "0.1.0"
description = "JAX/XLA-first recurrent conversion pipeline scaffold inspired by RADLADS"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nyx" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
jax = [
  "jax[cpu]>=0.4.0",
]
dev = [
  "jax[cpu]>=0.4.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
